[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hytri"
version = "0.1.0"
description = "Hybrid Failure Triage System - Cluster failures by root cause, prioritize fixes, and generate actionable explanations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "HyTri Team" }
]
keywords = ["testing", "triage", "clustering", "failure-analysis", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "hdbscan>=0.8.33",
    "rank-bm25>=0.2.2",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
hytri = "hytri.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hytri"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true


